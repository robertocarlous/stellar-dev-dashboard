version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '06:00'
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      stellar-sdk:
        patterns:
          - '@stellar/*'
        update-types:
          - minor
          - patch
      testing-tools:
        patterns:
          - '@playwright/*'
          - '@testing-library/*'
          - 'vitest'
          - 'jest*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
