name: Security Scanning

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high

      - name: Generate audit report
        if: always()
        run: npm audit --json > audit-report.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package-lock.json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  custom-security-scan:
    name: Custom Security Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run custom security scanner
        run: node scripts/security-scan.mjs

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: custom-security-scan
          path: security-scan-report.json
          retention-days: 30

  dependabot-config:
    name: Verify Dependabot Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate dependabot.yml
        run: |
          test -f .github/dependabot.yml
          grep -q 'package-ecosystem: npm' .github/dependabot.yml
          grep -q 'package-ecosystem: github-actions' .github/dependabot.yml
          echo "Dependabot configuration validated."

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: node scripts/security-scan.mjs --secrets-only

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [npm-audit, custom-security-scan, dependabot-config, secret-scan]
    if: always()
    steps:
      - name: Evaluate security gate
        run: |
          echo "## Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Custom Scanner | ${{ needs.custom-security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependabot Config | ${{ needs.dependabot-config.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.npm-audit.result }}" != "success" ]; then
            echo "::error::NPM audit failed."
            exit 1
          fi
          if [ "${{ needs.custom-security-scan.result }}" != "success" ]; then
            echo "::error::Custom security scanner failed."
            exit 1
          fi
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::Secret pattern scan failed."
            exit 1
          fi
