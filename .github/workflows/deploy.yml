name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        default: 'canary'
        type: choice
        options:
          - canary
          - direct
      rollback:
        description: 'Rollback to previous deployment'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'

jobs:
  # ── Stage 1: Pre-deploy validation ───────────────────────────────────────
  validate:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.rollback != true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.STELLAR_NETWORK }}

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-dist
          path: dist/
          retention-days: 1

  # ── Stage 2: Canary deployment ───────────────────────────────────────────
  canary-deploy:
    name: Canary Deploy
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.rollback != true) &&
      (github.event_name == 'push' || inputs.deployment_strategy == 'canary' || github.event_name != 'workflow_dispatch')
    environment:
      name: canary
      url: ${{ steps.canary.outputs.preview-url }}
    outputs:
      preview-url: ${{ steps.canary.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build for canary
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.STELLAR_NETWORK }}

      - name: Deploy canary (preview)
        id: canary
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: false

      - name: Record canary deployment
        run: |
          echo "### Canary Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: ${{ steps.canary.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 3: Canary smoke tests ──────────────────────────────────────────
  canary-smoke-test:
    name: Canary Smoke Tests
    runs-on: ubuntu-latest
    needs: [canary-deploy]
    if: |
      needs.canary-deploy.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.rollback != true)
    steps:
      - uses: actions/checkout@v6

      - name: Health check — canary preview
        run: |
          PREVIEW_URL="${{ needs.canary-deploy.outputs.preview-url }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::warning::No preview URL available — skipping smoke test."
            exit 0
          fi
          echo "Running smoke tests against: $PREVIEW_URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Canary health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::Canary smoke test failed after 3 attempts."
          exit 1

      - name: Performance check — response time
        run: |
          PREVIEW_URL="${{ needs.canary-deploy.outputs.preview-url }}"
          if [ -z "$PREVIEW_URL" ]; then exit 0; fi
          RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" "$PREVIEW_URL")
          echo "Response time: ${RESPONSE_TIME}s"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canary Response Time | ${RESPONSE_TIME}s |" >> "$GITHUB_STEP_SUMMARY"
          # Fail if response takes longer than 10 seconds
          if awk "BEGIN { exit !($RESPONSE_TIME > 10) }"; then
            echo "::warning::Canary response time exceeds 10s threshold."
          fi

  # ── Stage 4: Production deployment ───────────────────────────────────────
  production-deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs: [validate, canary-deploy, canary-smoke-test]
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.rollback != true) &&
      needs.validate.result == 'success' &&
      (
        (needs.canary-deploy.result == 'success' && needs.canary-smoke-test.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deployment_strategy == 'direct')
      )
    environment:
      name: production
      url: ${{ steps.production.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.STELLAR_NETWORK }}

      - name: Deploy to production
        id: production
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Post-deploy health check
        run: |
          PROD_URL="${{ steps.production.outputs.preview-url }}"
          if [ -n "$PROD_URL" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || echo "000")
            echo "Production health check: HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Production health check returned HTTP $STATUS"
            fi
          fi

      - name: Record deployment metadata
        run: |
          echo "### Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.production.outputs.preview-url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Strategy | ${{ inputs.deployment_strategy || 'canary' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── Rollback job ─────────────────────────────────────────────────────────
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rollback == true
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Rollback to previous deployment
        run: |
          echo "Rolling back to previous production deployment..."
          vercel rollback --token "${{ secrets.VERCEL_TOKEN }}" --yes
          echo "### Rollback Executed" >> "$GITHUB_STEP_SUMMARY"
          echo "Rolled back to the previous production deployment." >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Deployment gate summary ──────────────────────────────────────────────
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, canary-deploy, canary-smoke-test, production-deploy, rollback]
    if: always()
    steps:
      - name: Summarize deployment
        run: |
          echo "## Deployment Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | ${{ needs.validate.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canary Deploy | ${{ needs.canary-deploy.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canary Smoke Test | ${{ needs.canary-smoke-test.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production Deploy | ${{ needs.production-deploy.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback | ${{ needs.rollback.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.production-deploy.result }}" = "success" ] || [ "${{ needs.rollback.result }}" = "success" ]; then
            echo "Deployment pipeline completed successfully."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rollback }}" = "true" ] && [ "${{ needs.rollback.result }}" != "success" ]; then
            echo "::error::Rollback failed."
            exit 1
          elif [ "${{ needs.validate.result }}" = "failure" ]; then
            echo "::error::Pre-deploy validation failed."
            exit 1
          fi
