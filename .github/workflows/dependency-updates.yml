name: Dependency Updates

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Update scope'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - all

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  # ── Stage 1: Audit & compatibility check (parallel) ──────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run security audit
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  version-compatibility:
    name: Version Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verify dependency tree integrity
        run: |
          echo "## Version Compatibility Report" >> "$GITHUB_STEP_SUMMARY"
          npm ls --depth=0 2>&1 | tee dependency-tree.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -50 dependency-tree.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check for peer dependency conflicts
        run: |
          if npm ls 2>&1 | grep -q "UNMET PEER DEPENDENCY\|ERESOLVE"; then
            echo "::warning::Peer dependency conflicts detected — review before merging updates."
            npm ls 2>&1 | grep -E "UNMET|ERESOLVE" || true
          else
            echo "No peer dependency conflicts detected."
          fi

      - name: List outdated packages
        run: |
          echo "### Outdated Packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm outdated || true >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dependabot-config:
    name: Verify Dependabot Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate dependabot configuration
        run: |
          if [ ! -f .github/dependabot.yml ]; then
            echo "::error::.github/dependabot.yml not found"
            exit 1
          fi
          echo "Dependabot config validated."
          echo "| Ecosystem | Schedule |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|----------|" >> "$GITHUB_STEP_SUMMARY"
          grep -E "package-ecosystem|interval" .github/dependabot.yml \
            | paste - - \
            | sed 's/.*package-ecosystem: //;s/.*interval: //' \
            | awk '{print "| " $1 " | " $3 " |"}' >> "$GITHUB_STEP_SUMMARY" || true

  # ── Stage 2: Apply updates & test ─────────────────────────────────────────
  update-and-test:
    name: Update Dependencies & Test
    runs-on: ubuntu-latest
    needs: [security-audit, version-compatibility, dependabot-config]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply patch/minor updates
        run: |
          UPDATE_TYPE="${{ inputs.update_type || 'patch' }}"
          echo "Applying $UPDATE_TYPE updates..."
          if [ "$UPDATE_TYPE" = "patch" ]; then
            npx --yes npm-check-updates -u --target patch
          elif [ "$UPDATE_TYPE" = "minor" ]; then
            npx --yes npm-check-updates -u --target minor
          else
            npx --yes npm-check-updates -u
          fi
          npm install

      - name: Run compatibility test suite
        run: |
          npm run lint
          npm run type-check
          npm run test
          npm run build

      - name: Create automated update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): automated dependency updates'
          title: 'chore(deps): automated dependency updates'
          body: |
            ## Automated Dependency Update

            This PR was created by the dependency update workflow.

            ### Checks performed
            - Security audit
            - Version compatibility check
            - Peer dependency validation
            - Lint, type-check, unit tests, and build

            ### Update scope
            `${{ inputs.update_type || 'patch' }}`

            > Dependabot also opens individual PRs for security-critical updates.
          branch: chore/automated-dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated

  # ── Stage 3: Update gate summary ─────────────────────────────────────────
  update-gate:
    name: Dependency Update Gate
    runs-on: ubuntu-latest
    needs: [security-audit, version-compatibility, dependabot-config, update-and-test]
    if: always()
    steps:
      - name: Summarize dependency update pipeline
        run: |
          echo "## Dependency Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Compatibility | ${{ needs.version-compatibility.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependabot Config | ${{ needs.dependabot-config.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Update & Test | ${{ needs.update-and-test.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.version-compatibility.result }}" != "success" ]; then
            echo "::error::Version compatibility check failed."
            exit 1
          fi
          if [ "${{ needs.update-and-test.result }}" != "success" ]; then
            echo "::error::Dependency update testing failed."
            exit 1
          fi
